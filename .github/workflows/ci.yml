name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app_owner
          POSTGRES_PASSWORD: app_owner_dev
          POSTGRES_DB: posture
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app_owner -d posture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://app_owner:app_owner_dev@localhost:5432/posture
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4   # pin third-party actions to commit SHAs before production
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Create application roles
        run: PGPASSWORD=app_owner_dev psql -h localhost -U app_owner -d posture -f ../infra/postgres/init.sql
      - run: ruff check .
      - run: ruff format --check .
      - run: lint-imports
      - run: mypy .
      - name: No model/migration drift
        run: python manage.py makemigrations --check --dry-run
      - run: pytest --cov=apps --cov=scanner --cov-report=term-missing
      - name: Dependency audit
        run: pip-audit

  api-contract:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "backend[dev]"
      - run: cd backend && python manage.py spectacular --file /tmp/openapi.yaml --validate
      - name: Committed OpenAPI file is current
        run: diff backend/openapi.yaml /tmp/openapi.yaml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated client types are current
        run: npm run gen:api && git diff --exit-code src/lib/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
