[project]
name = "posture-scanner-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "django>=5.2,<7",
  "djangorestframework>=3.15",
  "drf-spectacular>=0.27",
  "psycopg[binary]>=3.2",
  "celery[redis]>=5.4",
  "dnspython>=2.6",
  "django-environ>=0.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-django>=4.9",
  "pytest-cov>=5",
  "ruff>=0.8",
  "mypy>=1.13",
  "django-stubs[compatible-mypy]>=5.1",
  "djangorestframework-stubs[compatible-mypy]>=3.15",
  "import-linter>=2.1",
  "pip-audit>=2.7",
  "pyyaml>=6",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers --reuse-db"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "DJ", "C4", "SIM", "PT", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict_optional = true
warn_unused_ignores = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["celery.*", "environ.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"
