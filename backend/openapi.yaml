openapi: 3.0.3
info:
  title: Security Posture Scanner API
  version: 0.1.0
paths:
  /api/v1/auth/csrf/:
    get:
      operationId: v1_auth_csrf_retrieve
      description: |-
        Sets the `csrftoken` cookie. The browser app calls this once before its first sign-in or
        sign-up request, because those are POSTs and Django rejects a POST without the token.
      tags:
      - v1
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/domains/:
    get:
      operationId: v1_domains_list
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Domain'
          description: ''
    post:
      operationId: v1_domains_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DomainCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DomainCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
          description: ''
  /api/v1/domains/{domain_id}/findings/:
    get:
      operationId: v1_domains_findings_list
      parameters:
      - in: path
        name: domain_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: status
        schema:
          type: string
          enum:
          - accepted_risk
          - all
          - false_positive
          - fixed
          - open
          default: open
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Finding'
          description: ''
  /api/v1/domains/{domain_id}/fix-first/:
    get:
      operationId: v1_domains_fix_first_list
      parameters:
      - in: path
        name: domain_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FixFirstItem'
          description: ''
  /api/v1/domains/{domain_id}/posture/:
    get:
      operationId: v1_domains_posture_retrieve
      parameters:
      - in: path
        name: domain_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Posture'
          description: ''
  /api/v1/domains/{domain_id}/reports/:
    get:
      operationId: v1_domains_reports_list
      parameters:
      - in: path
        name: domain_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Report'
          description: ''
    post:
      operationId: v1_domains_reports_create
      parameters:
      - in: path
        name: domain_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
          description: ''
        '403':
          description: No response body
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportError'
          description: ''
  /api/v1/domains/{domain_id}/scans/:
    get:
      operationId: v1_domains_scans_list
      parameters:
      - in: path
        name: domain_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Scan'
          description: ''
    post:
      operationId: v1_domains_scans_create
      parameters:
      - in: path
        name: domain_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ScanCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ScanCreateRequest'
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scan'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanError'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanError'
          description: ''
  /api/v1/domains/{domain_id}/verification/:
    post:
      operationId: v1_domains_verification_create
      parameters:
      - in: path
        name: domain_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationInstructions'
          description: ''
  /api/v1/domains/{domain_id}/verification/check/:
    post:
      operationId: v1_domains_verification_check_create
      parameters:
      - in: path
        name: domain_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationCheck'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/findings/{finding_id}/:
    get:
      operationId: v1_findings_retrieve
      parameters:
      - in: path
        name: finding_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingDetail'
          description: ''
  /api/v1/findings/{finding_id}/accept-risk/:
    post:
      operationId: v1_findings_accept_risk_create
      parameters:
      - in: path
        name: finding_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptRiskRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AcceptRiskRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AcceptRiskRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Finding'
          description: ''
  /api/v1/me/:
    get:
      operationId: v1_me_retrieve
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/reports/{report_id}/:
    get:
      operationId: v1_reports_retrieve
      parameters:
      - in: path
        name: report_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
          description: ''
  /api/v1/reports/{report_id}/pdf/:
    get:
      operationId: v1_reports_pdf_retrieve
      parameters:
      - in: path
        name: report_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportError'
          description: ''
  /api/v1/scans/{scan_id}/:
    get:
      operationId: v1_scans_retrieve
      parameters:
      - in: path
        name: scan_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scan'
          description: ''
components:
  schemas:
    AcceptRiskRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 10
          maxLength: 2000
        until:
          type: string
          format: date-time
          description: Review date; at most 365 days away.
      required:
      - reason
      - until
    Domain:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        fqdn:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/DomainStatusEnum'
          readOnly: true
          default: pending
        verified_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        reverify_due:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - fqdn
      - id
      - reverify_due
      - status
      - verified_at
    DomainCreateRequest:
      type: object
      properties:
        fqdn:
          type: string
          minLength: 1
          maxLength: 253
      required:
      - fqdn
    DomainStatusEnum:
      enum:
      - pending
      - verified
      - expired
      - suspended
      type: string
      description: |-
        * `pending` - Pending
        * `verified` - Verified
        * `expired` - Expired
        * `suspended` - Suspended
    Error:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    Finding:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        check_key:
          type: string
        title:
          type: string
        asset:
          type: string
          readOnly: true
        severity:
          allOf:
          - $ref: '#/components/schemas/SeverityEnum'
          readOnly: true
        score:
          type: number
          format: double
        tier:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEcfEnum'
          readOnly: true
        first_seen_at:
          type: string
          format: date-time
          readOnly: true
        last_seen_at:
          type: string
          format: date-time
          readOnly: true
        reopened_count:
          type: integer
          readOnly: true
        accepted_until:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - accepted_until
      - asset
      - check_key
      - first_seen_at
      - id
      - last_seen_at
      - reopened_count
      - score
      - severity
      - status
      - tier
      - title
    FindingDetail:
      type: object
      description: A finding with the plain-language text the customer was shown.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        check_key:
          type: string
        title:
          type: string
        asset:
          type: string
          readOnly: true
        severity:
          allOf:
          - $ref: '#/components/schemas/SeverityEnum'
          readOnly: true
        score:
          type: number
          format: double
        tier:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEcfEnum'
          readOnly: true
        first_seen_at:
          type: string
          format: date-time
          readOnly: true
        last_seen_at:
          type: string
          format: date-time
          readOnly: true
        reopened_count:
          type: integer
          readOnly: true
        accepted_until:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        plain_explanation:
          type: string
        why_it_matters:
          type: string
        fix_steps:
          type: array
          items:
            type: string
        effort:
          type: string
        owner_hint:
          type: string
        accepted_reason:
          type: string
          readOnly: true
      required:
      - accepted_reason
      - accepted_until
      - asset
      - check_key
      - effort
      - first_seen_at
      - fix_steps
      - id
      - last_seen_at
      - owner_hint
      - plain_explanation
      - reopened_count
      - score
      - severity
      - status
      - tier
      - title
      - why_it_matters
    FixFirstItem:
      type: object
      properties:
        rank:
          type: integer
        finding_id:
          type: string
          format: uuid
        check_key:
          type: string
        asset:
          type: string
        title:
          type: string
        plain_explanation:
          type: string
        why_it_matters:
          type: string
        fix_steps:
          type: array
          items:
            type: string
        effort:
          type: string
        owner_hint:
          type: string
        severity:
          type: string
        score:
          type: number
          format: double
        tier:
          type: string
      required:
      - asset
      - check_key
      - effort
      - finding_id
      - fix_steps
      - owner_hint
      - plain_explanation
      - rank
      - score
      - severity
      - tier
      - title
      - why_it_matters
    GradeEnum:
      enum:
      - A
      - B
      - C
      - D
      - F
      type: string
      description: |-
        * `A` - A
        * `B` - B
        * `C` - C
        * `D` - D
        * `F` - F
    Me:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
        mfa_enabled:
          type: boolean
      required:
      - display_name
      - email
      - id
      - memberships
      - mfa_enabled
    Membership:
      type: object
      properties:
        tenant_id:
          type: string
          format: uuid
        tenant_name:
          type: string
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - role
      - tenant_id
      - tenant_name
    ModeEnum:
      enum:
      - passive
      - active
      type: string
      description: |-
        * `passive` - Passive
        * `active` - Active
    Posture:
      type: object
      properties:
        score:
          type: integer
          maximum: 100
          minimum: 0
        grade:
          $ref: '#/components/schemas/GradeEnum'
        total_risk:
          type: number
          format: double
        capped_by:
          type: string
          nullable: true
        open_findings:
          type: integer
        counts_by_tier:
          type: object
          additionalProperties:
            type: integer
      required:
      - capped_by
      - counts_by_tier
      - grade
      - open_findings
      - score
      - total_risk
    Report:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        domain_id:
          type: string
          format: uuid
        scan_id:
          type: string
          format: uuid
        generated_at:
          type: string
          format: date-time
          readOnly: true
        score:
          type: integer
          readOnly: true
        grade:
          type: string
          readOnly: true
        open_findings:
          type: integer
          readOnly: true
      required:
      - domain_id
      - generated_at
      - grade
      - id
      - open_findings
      - scan_id
      - score
    ReportError:
      type: object
      properties:
        detail:
          type: string
        code:
          type: string
      required:
      - code
      - detail
    RoleEnum:
      enum:
      - owner
      - admin
      - viewer
      type: string
      description: |-
        * `owner` - Owner
        * `admin` - Admin
        * `viewer` - Viewer
    Scan:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        domain_id:
          type: string
          format: uuid
        mode:
          allOf:
          - $ref: '#/components/schemas/ModeEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ScanStatusEnum'
          readOnly: true
        trigger_type:
          allOf:
          - $ref: '#/components/schemas/TriggerTypeEnum'
          readOnly: true
        queued_at:
          type: string
          format: date-time
          readOnly: true
        started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        finished_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - domain_id
      - finished_at
      - id
      - mode
      - queued_at
      - started_at
      - status
      - trigger_type
    ScanCreateRequest:
      type: object
      properties:
        mode:
          allOf:
          - $ref: '#/components/schemas/ModeEnum'
          default: passive
    ScanError:
      type: object
      properties:
        detail:
          type: string
        code:
          type: string
      required:
      - code
      - detail
    ScanStatusEnum:
      enum:
      - queued
      - running
      - succeeded
      - partial
      - failed
      - cancelled
      - refused
      type: string
      description: |-
        * `queued` - Queued
        * `running` - Running
        * `succeeded` - Succeeded
        * `partial` - Partial
        * `failed` - Failed
        * `cancelled` - Cancelled
        * `refused` - Refused
    SeverityEnum:
      enum:
      - critical
      - high
      - medium
      - low
      - info
      type: string
      description: |-
        * `critical` - Critical
        * `high` - High
        * `medium` - Medium
        * `low` - Low
        * `info` - Info
    StatusEcfEnum:
      enum:
      - open
      - fixed
      - accepted_risk
      - false_positive
      type: string
      description: |-
        * `open` - Open
        * `fixed` - Fixed
        * `accepted_risk` - Accepted Risk
        * `false_positive` - False Positive
    TriggerTypeEnum:
      enum:
      - manual
      - scheduled
      type: string
      description: |-
        * `manual` - Manual
        * `scheduled` - Scheduled
    VerificationCheck:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/VerificationCheckStatusEnum'
      required:
      - status
    VerificationCheckStatusEnum:
      enum:
      - queued
      - already_verified
      type: string
      description: |-
        * `queued` - queued
        * `already_verified` - already_verified
    VerificationInstructions:
      type: object
      properties:
        method:
          type: string
        record_name:
          type: string
        record_value:
          type: string
          description: Shown once. Store it before leaving the page.
        expires_at:
          type: string
          format: date-time
      required:
      - expires_at
      - method
      - record_name
      - record_value
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
